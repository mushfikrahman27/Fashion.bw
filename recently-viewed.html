<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recently Viewed | POLICIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <style>
    body { 
        background-color: #0a0a0a; 
        color: white; 
        margin: 0;
        font-family: 'Montserrat', sans-serif;
    }

    .recent-section { 
        padding: 120px 15px 50px; 
        min-height: 80vh; 
    }

    .page-title { 
        text-align: center; 
        font-family: 'Playfair Display', serif; 
        font-size: 2.5rem; 
        margin-bottom: 40px; 
        letter-spacing: 2px;
    }

    /* --- GLOBAL GRID (Laptop-e 4 ta thakbe) --- */
    .product-grid {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 20px !important;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* --- MOBILE ADJUSTMENT (Row-te exactly 2-ta) --- */
    @media (max-width: 768px) {
        .product-grid {
            grid-template-columns: repeat(2, 1fr) !important; /* Ek row-te 2-ta */
            gap: 12px !important;
            padding: 0 5px;
        }

        .page-title { 
            font-size: 1.8rem; 
            margin-bottom: 25px;
        }

        /* Card er height control jate beshi lamba na dekhay */
        .product-card {
            display: flex !important;
            flex-direction: column !important;
            height: auto !important;
        }

        /* Image jate lamba ba chapta na hoy */
        .product-img-holder {
            width: 100% !important;
            aspect-ratio: 1 / 1 !important; /* Square Proportion */
            overflow: hidden !important;
        }

        .product-img-holder img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        /* Mobile-e choto font jate fix hoy */
        .p-name {
            font-size: 13px !important;
            margin-top: 8px !important;
        }

        .p-price {
            font-size: 14px !important;
        }

        /* Button group layout fix */
        .button-group {
            flex-direction: row !important; /* Pashapashi button */
            gap: 5px !important;
            margin-top: 10px !important;
        }

        .action-btn {
            font-size: 9px !important;
            padding: 10px 0 !important;
        }
    }
</style>
<style>
    /* ... ager code gulo thakbe ... */

    @media (max-width: 768px) {
        .product-grid {
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 10px !important;
            padding: 0 10px !important;
        }

        /* CARD HEIGHT & WIDTH FIX */
        .product-card {
            width: 100% !important;
            height: 300px !important; /* Fixed height jate lamba na hoy */
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            background: #111 !important; /* Card background color match */
            border-radius: 10px !important;
            overflow: hidden !important;
            margin-bottom: 5px !important;
        }

        /* IMAGE AREA: Height komiye square kora */
        .product-img-holder {
            height: 160px !important; /* Image er height fix */
            width: 100% !important;
        }

        .product-img-holder img {
            height: 100% !important;
            width: 100% !important;
            object-fit: cover !important;
        }

        /* INFO AREA: Spacing komano */
        .p-info {
            padding: 8px !important;
            text-align: center !important;
        }

        .p-name {
            font-size: 12px !important;
            height: 32px !important; /* 2 line text limit */
            overflow: hidden !important;
            margin: 5px 0 !important;
        }

        .p-price {
            font-size: 13px !important;
            font-weight: bold !important;
            color: #ff4d4d !important;
        }

        /* BUTTONS: Pashapashi ar choto */
        .button-group {
            display: flex !important;
            gap: 4px !important;
            padding: 5px !important;
        }

        .action-btn {
            font-size: 8px !important;
            padding: 8px 0 !important;
            letter-spacing: 0 !important;
        }
    }
</style>
</head><body>

    <nav class="navbar" style="position: fixed; width: 100%; top: 0; z-index: 1000; background: #0a0a0a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; height: 70px; border-bottom: 1px solid rgba(255,255,255,0.05);">
        <div class="nav-left">
            <button onclick="event.preventDefault(); window.history.back();" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; border-radius: 5px; font-family: 'Montserrat', sans-serif; font-size: 12px;">
                <span style="font-size: 16px;">←</span> BACK
            </button>
        </div>
        
        <div class="nav-center" style="position: absolute; left: 50%; transform: translateX(-50%);">
            <a href="index.html" class="brand-name" style="text-decoration: none; font-size: 1.5rem; letter-spacing: 2px;">POLI<span>CIA</span></a>
        </div>

        <div class="nav-right" style="width: 80px;"></div>
    </nav>

    <section class="recent-section">
        <h1 class="page-title">RECENTLY <span style="color: #c55976;">VIEWED</span></h1>
        
        <div id="recent-container" class="product-grid"></div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('recent-container');
            const savedCards = JSON.parse(localStorage.getItem('recentCards')) || [];

            if (savedCards.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px; opacity: 0.5;">
                        <p>No products viewed yet.</p>
                        <a href="index.html" style="color: #c55976; text-decoration: none;">GO SHOPPING</a>
                    </div>`;
                return;
            }

            savedCards.forEach(cardHTML => {
                grid.innerHTML += cardHTML;
            });
        });
    </script>

    <script src="script.js" defer></script>
</body>
</html>
