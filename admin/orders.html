<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Orders - INARAH</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/orders.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">INARAH</div>
        
        <a href="dashboard-new.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="orders.html" class="nav-item active">
            <i class="fas fa-shopping-bag"></i>
            <span>Orders</span>
        </a>
        <a href="products.html" class="nav-item">
            <i class="fas fa-box"></i>
            <span>Stock</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-user-cog"></i>
            <span>Admin</span>
        </a>
    </aside>

    <main class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-family: 'Playfair Display';">Live Orders</h2>
            <span id="order-count-badge" style="background: var(--gold); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">0</span>
        </div>

        <div id="live-order-list" class="order-list">
            <p id="order-loader" style="text-align: center; color: #666;">Waiting for new orders...</p>
        </div>
    </main>

    <script type="module" src="js/orders-live.js"></script>
</body>
</html>
