<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - INARAH</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">INARAH</h1>
            <p class="auth-subtitle">Admin Portal</p>
            
            <form id="loginForm" onsubmit="return false;">
                <input type="email" id="email" class="auth-input" placeholder="Admin Email" required autocomplete="email">
                <input type="password" id="pass" class="auth-input" placeholder="Admin Password" required autocomplete="current-password">
                
                <button type="submit" id="loginBtn" class="btn-login" onclick="loginAdmin()">
                    <span id="btnText">Sign In</span>
                </button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </form>
        </div>
    </div>

    <script type="module" src="js/auth-guard.js"></script>
</body>
</html>
