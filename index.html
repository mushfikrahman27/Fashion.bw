<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionForAll | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="light-comfort-bg"></div>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-scroll-container">
            <button class="close-btn" onclick="toggleMenu()">✕</button>
            <nav class="drawer-nav">
                <ul class="main-links">
                    <li class="nested">
                        <button class="category-trigger" onclick="toggleSub(this)">
                            <span class="cat-text">Men</span>
                            <span class="plus-icon">+</span>
                        </button>
                        <ul class="sub-links">
                            <li><a href="#">Sneakers</a></li>
                            <li><a href="#">Bags</a></li>
                            <li><a href="#">Sunglasses</a></li>
                        </ul>
                    </li>
                    <li class="nested">
                        <button class="category-trigger" onclick="toggleSub(this)">
                            <span class="cat-text">Women</span>
                            <span class="plus-icon">+</span>
                        </button>
                        <ul class="sub-links">
                            <li><a href="#">Sneakers</a></li>
                            <li><a href="#">Bags</a></li>
                            <li><a href="#">Sunglasses</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <button class="menu-btn" onclick="toggleMenu()">
                <div class="hamburger-icon-stylish">
                    <span class="line-top"></span>
                    <span class="line-mid"></span>
                    <span class="line-bottom"></span>
                </div>
                <span class="menu-text">MENU</span>
            </button>
        </div>
        <div class="nav-center">
            <div class="logo-box"></div>
            <div class="brand-name">POLI<span>CIA</span></div>
        </div>
        <div class="nav-right">
            <div class="stylish-search">
                <input type="text" placeholder="Search...">
                <span class="search-line"></span>
                <svg class="mobile-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="cart-glass" onclick="toggleCartDisplay()">
                🛒 (<span id="navbarCartCount">0</span>)
            </div>
        </div>
    </nav>

    <div class="future-design-space">
        <p>[ Reserved Space for Future Banner/Design ]</p>
    </div>

    <div id="cartSerialOverlay" class="cart-serial-overlay">
        <div class="cart-serial-content">
            <button class="close-btn" onclick="toggleCartDisplay()">✕</button>
            <h3 class="cart-title">Selected Items</h3>
            <div id="serialItemList"></div>
        </div>
    </div>

    <section class="products-section">
        <h2 class="section-title">Our Products</h2>
        <div class="product-grid" id="productGrid"></div>

        <div class="pagination-footer">
            <div class="pagination-column" id="paginationBar"></div>
            <button class="scroll-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"></polyline></svg>
                <span>Back to Top</span>
            </button>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="brand-name">Fashion<span>ForAll</span></div>
            <p>&copy; 2026 Premium Shop. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
