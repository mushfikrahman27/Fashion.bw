<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionForAll | Premium Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <button class="menu-btn" onclick="toggleMenu()">
            <div class="hamburger-icon-stylish">
                <span class="line-top"></span>
                <span class="line-mid"></span>
                <span class="line-bottom"></span>
            </div>
            <span class="menu-text">MENU</span>
        </button>
    </div>

    <div class="nav-center">
        <div class="logo-box"></div>
        <div class="brand-name">POLI<span>CIA</span></div>
    </div>

 <div class="nav-right">
    <div class="stylish-search">
        <svg class="mobile-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        
        <input type="text" id="searchInput" placeholder="Search...">
        
        <button id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
        </button>

        <div id="searchSuggestions" class="search-suggestions-popup"></div>
    </div>

    <div class="cart-glass" onclick="toggleCartDisplay()">
        🛒 (<span id="navbarCartCount">0</span>)
    </div>
</div>

    <div id="menuOverlay" class="menu-overlay">
       <div class="menu-header">
    <button class="menu-back-btn" onclick="toggleMenu()" aria-label="Close Menu">
        <div class="back-icon-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </div>
        <span class="back-text">CLOSE</span>
    </button>
</div>

        <div class="menu-scroll-container">
            <div class="nested">
                <button class="category-trigger" onclick="toggleSub(this)">
                    <span class="cat-text">MEN</span>
                    <span class="plus-icon">+</span>
                </button>
                <ul class="sub-links">
                    <li><a href="#" onclick="filterByCategory('Premium'); toggleMenu()">Bags</a></li>
                    <li><a href="#" onclick="filterByCategory('All'); toggleMenu()">Sunglasses</a></li>
                    <li><a href="#" onclick="filterByCategory('Premium'); toggleMenu()">Sneakers</a></li>
                </ul>
            </div>

            <div class="nested">
                <button class="category-trigger" onclick="toggleSub(this)">
                    <span class="cat-text">WOMEN</span>
                    <span class="plus-icon">+</span>
                </button>
                <ul class="sub-links">
                    <li><a href="#" onclick="filterByCategory('Handbag'); toggleMenu()">Handbags</a></li>
                    <li><a href="#" onclick="filterByCategory('Tote'); toggleMenu()">Sunglasses</a></li>
                    <li><a href="#" onclick="filterByCategory('Premium'); toggleMenu()">Accessories</a></li>
                </ul>
            </div>

            <div class="nested">
                <button class="category-trigger" onclick="toggleSub(this)">
                    <span class="cat-text">COLLECTIONS</span>
                    <span class="plus-icon">+</span>
                </button>
                <ul class="sub-links">
                    <li><a href="#" onclick="filterByCategory('All'); toggleMenu()">New Arrivals</a></li>
                    <li><a href="#" onclick="filterByCategory('Premium'); toggleMenu()">Best Sellers</a></li>
                </ul>
            </div>
            
            <div style="height: 150px; width: 100%;"></div>
        </div>
    </div>
</nav>
<section class="hero-parallax">
    <div class="hero-bg-image" style="background-image: url('policia-hero-bg.jpeg');"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">Redefining Elegance</h1>
        <p class="hero-subtitle">Curated Luxury for the Modern Individual</p>
        <button class="hero-cta" onclick="document.querySelector('.products-section').scrollIntoView({behavior:'smooth'})">
            Explore Collection
        </button>
    </div>
</section>
</section>

    <div id="cartSerialOverlay" class="cart-serial-overlay">
        <div class="cart-serial-content">
            <button class="close-btn" onclick="toggleCartDisplay()">✕</button>
            <h3 class="cart-title">Selected Items</h3>
            <div id="serialItemList"></div>
        </div>
    </div>

    <section class="products-section">
        <h2 class="section-title">Our Products</h2>

        <div class="filter-pill-container">
            <div class="filter-pills">
                <button class="pill active" onclick="filterByCategory('All', this)">All</button>
                <button class="pill" onclick="filterByCategory('Tote', this)">Tote</button>
                <button class="pill" onclick="filterByCategory('Handbag', this)">Handbags</button>
                <button class="pill" onclick="filterByCategory('Premium', this)">Premium</button>
            </div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="pagination-footer">
            <div class="pagination-column" id="paginationBar"></div>
            <button class="scroll-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"></polyline></svg>
                <span>Back to Top</span>
            </button>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="brand-name">Fashion<span>ForAll</span></div>
            <p>&copy; 2026 Premium Shop. All rights reserved.</p>
        </div>
    </footer>

<div id="toastContainer" class="toast-container"></div> 
    <div class="light-comfort-bg"></div>
    <script src="script.js"></script> 
</body>
</html>
